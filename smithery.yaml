# Smithery configuration for Tribunal TJSP: Certidão Criminal de 1º Grau
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tribunal_tjsp_pedido_criminal

name: tribunal_tjsp_pedido_criminal-mcp
displayName: "Tribunal TJSP: Certidão Criminal de 1º Grau"
description: >
  Tribunal TJSP: Certidão Criminal de 1º Grau, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tribunal_tjsp_pedido_criminal-mcp
repository: https://github.com/mcp-dir/tribunal_tjsp_pedido_criminal-mcp

tags:
  - tribunal_tjsp_pedido_criminal
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tribunal_tjsp_pedido_criminal

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tribunal_tjsp_pedido_criminal/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
